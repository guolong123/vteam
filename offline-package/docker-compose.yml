# ============================================================
# vteam 离线部署 compose（linux/amd64）
#
# 与仓库根目录 docker-compose.yml 的差异：
#   1. **不 build**，全部服务用 image: 直接引用离线包内置镜像
#      默认引用**本地离线 tag**（vteam/<组件>:<版本>）——start.sh 导入 tar 时就打好，
#      因此离线端全程不访问任何 registry
#   2. **无 build 上下文依赖**：不依赖 git 仓库、node_modules、源码目录
#   3. 敏感配置全部来自 .env（由 start.sh 首次运行时自动生成随机值）
#   4. 端口可用 .env 覆盖（默认沿用仓库根 compose 的 13000/13001/14000/14848）
#
# 镜像来源：线上 k8s 环境实际运行的同一批镜像（docker-hosted.ketaops.cc/ketaops/vteam-*:v1.3.3），
#          本包只做「拉取 → save → 离线导入」，**不重新构建**。
#
# 服务拓扑（与仓库 compose / helm chart 五服务对齐）：
#   db      mysql:8（volume + healthcheck，compose 网络内互通，不映射宿主端口）
#   init    一次性：prisma migrate deploy + seed（service_completed_successfully 门控 server）
#   server  NestJS（healthcheck /api/v1/health；宿主 13000）
#   web     Next.js standalone（API_PROXY_TARGET=http://server:3000；宿主 13001）
#   worker  opencode worker（X-Worker-Token 注册 + serve；宿主 14000 / 14848）
#
# 运行：./start.sh（自动 load 镜像 + up -d）
# 停止：./stop.sh
# ============================================================

name: vteam-offline

services:
  db:
    # mysql **按 digest 钉死**：与线上 k8s 集群实际运行的版本完全一致
    # （`:8` 浮动 tag 期间上游已重推过，指向另一 digest）。
    image: ${MYSQL_IMAGE:-vteam/mysql:v1.3.3}
    platform: linux/amd64
    container_name: vteam-offline-db
    restart: unless-stopped
    command: --sort-buffer-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vteam-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vteam}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 不校验凭据，仅探测 mysqld 存活（认证失败仍返回 alive）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - vteam-net

  # 一次性初始化：迁移基线 + 种子数据（server 依赖其成功完成）
  # seed 用编译产物 node dist/prisma/seed.js（runner 镜像无源码不能 ts-node）
  init:
    image: ${SERVER_IMAGE:-vteam/server:v1.3.3}
    platform: linux/amd64
    container_name: vteam-offline-init
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js"
    # &server-env：锚点定义在此，server 服务用 <<: *server-env 合并继承
    environment: &server-env
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-vteam-root}@db:3306/vteam
      # 平台 MCP URL：seed 写入 mcp_servers 表。compose 内服务名为 server
      # （K8s 下是 <release>-server，由 chart init Job 注入），此处显式下发避免回落。
      PLATFORM_MCP_URL: ${PLATFORM_MCP_URL:-http://server:3000/api/v1/platform-mcp}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vteam-net

  server:
    image: ${SERVER_IMAGE:-vteam/server:v1.3.3}
    platform: linux/amd64
    container_name: vteam-offline-server
    restart: unless-stopped
    environment:
      <<: *server-env
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请检查 .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN 未设置，请检查 .env}
      # ⚠️ 这里**不再**导出 SERVER_PASSWORD：控制面自 v2 适配起**不再直连 opencode serve**
      # （决策 D3），它只调 worker 的执行端点（`POST /sessions`、`POST /sessions/:id/prompt`、
      # `GET /sessions/:id/messages`、`POST /sessions/:id/abort`、`GET /models`），
      # 鉴权用 `X-Worker-Token`（= 上面这个 WORKER_TOKEN，与 worker 侧 X_WORKER_TOKEN 同值）。
      # ⇒ serve 的 Basic Auth 密码只存在于 worker 一侧（OPENCODE_SERVER_PASSWORD），
      # **控制面不需要知道它**；两侧不同值也不会再导致 401。
      # 模型 provider token 加密密钥（C4 AES-256-GCM，32 字节/64 hex）。
      # 必填校验：未设置即启动报错（拒绝公开默认值导致密钥泄露）。
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:?MODEL_CREDENTIAL_KEY 未设置，请检查 .env}
      # 事件静默自愈窗口（滑动）：距最近一次回流事件 600s 无事件 → 自动唤醒重试（最多 3 次）
      SILENT_SESSION_WAKE_MS: "600000"
      AGENT_IDLE_TIMEOUT_MS: "0"
      # 记忆定时整理：间隔 ms，0 = 禁用。默认 7 天。
      MEMORY_MAINTENANCE_INTERVAL_MS: "604800000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      # node:22-alpine 无 curl/wget，用内置 fetch（node 18+ 全局可用）
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${SERVER_PORT:-13000}:3000"
    volumes:
      # P2 产出物落盘持久化：Agent 文档/文件产出物存 /app/uploads（server 静态服务挂载点），
      # 容器重建不丢文件（DB 元数据与磁盘文件一致）
      - uploads_data:/app/uploads
    networks:
      - vteam-net

  web:
    image: ${WEB_IMAGE:-vteam/web:v1.3.3}
    platform: linux/amd64
    container_name: vteam-offline-web
    restart: unless-stopped
    environment:
      # 运行时代理目标（middleware.ts 读取）：compose 网络内服务名 server
      API_PROXY_TARGET: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # standalone server.js 以 HOSTNAME env（容器自动=容器 ID）为监听地址，非 127.0.0.1；
      # healthcheck 必须访问 $HOSTNAME 而非 loopback（node:22-alpine 无 curl，用内置 fetch）
      test: ["CMD", "node", "-e", "fetch('http://'+process.env.HOSTNAME+':3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${WEB_PORT:-13001}:3000"
    networks:
      - vteam-net

  worker:
    image: ${WORKER_IMAGE:-vteam/worker:v1.3.3}
    platform: linux/amd64
    container_name: vteam-offline-worker
    restart: unless-stopped
    environment:
      X_WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN 未设置，请检查 .env}
      SERVER_URL: http://server:3000
      WORKER_ID: ${WORKER_ID:-w_compose_worker}
      OPENCODE_SERVE_HOSTNAME: 0.0.0.0
      # 固定 opencode serve 端口（compose 网络内 4000；k8s chart 同值）
      OPENCODE_SERVE_PORT: "4000"
      # opencode serve 认证密码（Basic Auth，用户名固定 opencode；v2 恒开鉴权，worker 必需）：
      # 为空 → worker 启动 fail-fast。**只存在于 worker 一侧**：控制面不直连 serve，
      # 鉴权走 X-Worker-Token ⇒ 不需要与 server 侧同值，server 侧也没有该变量。
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD 未设置，请检查 .env}
      WORKER_ADVERTISE_HOST: http://worker
      # worker 默认模型兜底：Agent 未配模型时用；空 = 不指定（serve 默认）
      WORKER_DEFAULT_MODEL: ${WORKER_DEFAULT_MODEL:-}
      # 代码版本：与镜像内 WORKER_CODE_VERSION 同源（v1.3.3）
      WORKER_CODE_VERSION: ${WORKER_CODE_VERSION:-v1.3.3}
      # 并发上限：worker 上报 capabilities.maxInstances，server 按此算剩余容量派单
      WORKER_MAX_INSTANCES: ${WORKER_MAX_INSTANCES:-10}
      # 首字超时（worker awaitCompletion）：300s 内无首字输出即 abort 释放槽位
      WORKER_FIRST_TOKEN_TIMEOUT_MS: "300000"
      # 持久化工作目录：serve cwd + .opencode/tools|skills 注入落点 + agent 工作区
      WORK_DIR: /data/vteam-worker
      # ⚠️ OPENCODE_PURE 由 opencode 自己解析为布尔环境变量，**空串会让 serve 直接启动失败**。
      # 整条注释掉 = 不设该变量 = 非 pure（内置插件 omo 生效）。
      # OPENCODE_PURE: "true"
      # agent-browser 容器内默认参数（覆盖 Dockerfile ENV，可通过 env 调整）
      AGENT_BROWSER_ARGS: --no-sandbox,--disable-gpu
    depends_on:
      server:
        condition: service_healthy
    ports:
      # serve 容器内 4000 → 宿主机 14000，浏览器访问 http://localhost:14000
      - "${WORKER_SERVE_PORT:-14000}:4000"
      # agent-browser dashboard（宿主 14848 -> 容器 4848，Agent 浏览器可视化/回放）
      - "${AGENT_BROWSER_DASHBOARD_PORT:-14848}:4848"
    volumes:
      # 统一持久化：/data/vteam-worker 含 serve cwd、.opencode 注入及全部任务实例目录
      - vteam_worker_data:/data/vteam-worker
      # 用户目录（HOME=/root）持久化：opencode.db 会话库、auth.json 模型凭据、
      # .keta-git-creds.json、log、repos 以及 agent-browser 状态
      - worker_home:/root
    networks:
      - vteam-net

volumes:
  mysql_data:
  # P2：server 产出物落盘持久化（Agent 文档/文件，见 server 服务 volumes 挂载）
  uploads_data:
  # 统一持久化：vteam-worker 含 serve 工作目录及全部实例目录
  vteam_worker_data:
  # worker 用户目录（HOME）持久化（opencode.db 会话库、auth.json 模型凭据、.keta-git-creds.json）
  worker_home:

networks:
  vteam-net:
    driver: bridge
