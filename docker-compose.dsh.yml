# ============================================================
# vteam 试用栈（dsh 引擎）——**兼容层 / 观察面板**
#
#   ⚠️ 2026-11-20 起：**dsh worker 已默认纳入主 `docker-compose.yml`**（服务名
#   `worker-dsh`，与 opencode 的 `worker` 并存）。因此**日常不再需要本文件**：
#
#       docker compose -p vteam up -d          # 一步起 db/init/server/web/worker/worker-dsh
#
#   本文件现在只做两件事：
#     1. 保留旧命令 `-f docker-compose.yml -f docker-compose.dsh.yml` 的**兼容性**——
#        旧命令过去会"替换" worker 引擎；现在 worker-dsh 本来就在了，故此处**不再重复
#        定义 worker**（重复定义会把同一份 Dockerfile.dsh 起成两个同 name 容器，
#        第二个必然因容器名冲突失败）。
#     2. 提供 `dsh-inspect` 观察面板（DSH 原生 Web UI，只读旁挂，不参与 vteam 执行）。
#
#   历史用法（仍可用，等价于只多起观察面板）：
#     docker compose -p vteam -f docker-compose.yml -f docker-compose.dsh.yml up -d
#
# 访问地址：http://localhost:13001 · DSH 面板 http://localhost:13080
# ============================================================

services:
  # dsh worker 已由主 compose 定义（服务名 worker-dsh），这里只对齐卷名。
  # ⚠️ 不要在此重复定义 build/image/container_name —— 那会与主 compose 的服务
  # 变成两个实例（compose 合并同名服务，但旧版脚本传了不同的 dockerfile 时会覆盖，
  # 导致主 compose 的 worker-dsh 也被改成同一引擎，两个服务抢同一个容器名）。
  dsh-inspect:
    image: vteam-worker:dsh
    container_name: vteam-compose-dsh-inspect
    restart: unless-stopped
    # 复用 worker-dsh 的两个卷：会话数据（dsh_home）+ 工作目录（便于查看注入产物）
    volumes:
      - dsh_home:/data/dsh-home
      - dsh_worker_data:/data/vteam-worker
    environment:
      DSH_HOME: /data/dsh-home
      # provider 凭据：与 worker 同源（web profile 也需要它才能发起模型请求）
      VTEAM_PROVIDER_OPENCODE_GO_KEY: ${DSH_API_KEY:-}
    command:
      - sh
      - -c
      - >-
        dsh web --no-open --port 3080 --host $$(hostname -i)
        --trusted-host 127.0.0.1
        --trusted-host localhost
        --trusted-host 127.0.0.1:13080
        --trusted-host localhost:13080
    ports:
      # 宿主 13080 → 容器 3080
      - "13080:3080"
    depends_on:
      worker-dsh:
        condition: service_started
    networks:
      - vteam-net

# 卷在**主 compose** 里已定义（dsh_home / dsh_worker_data），此处不重复声明：
# 重复声明不同属性会触发 compose 的合并告警，且容易与主文件漂移。
