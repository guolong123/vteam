# web Service（ClusterIP :3000）
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vteam.web.name" . }}
  labels:
    {{- include "vteam.labels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vteam.matchLabels" (dict "context" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: {{ .Values.service.web.targetPort }}
      protocol: TCP
