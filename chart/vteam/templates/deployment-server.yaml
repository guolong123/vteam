# server（NestJS）— 对齐 compose server 服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vteam.server.name" . }}
  labels:
    {{- include "vteam.labels" (dict "context" . "component" "server") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.server }}
  # is_0000000040 方案 B：单实例设计下滚动更新会产生新旧 pod 并存窗口，进程内
  # id 计数器从相近 seed 生成重叠 ev_ 序号 → realtimeEvent PRIMARY 冲突偶发 500。
  # 改为 Recreate（先删旧再起新）消除并存窗口；配合代码层 P2002 自愈兜底（方案 A）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vteam.matchLabels" (dict "context" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vteam.matchLabels" (dict "context" . "component" "server") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 等数据库 TCP 就绪。RealtimeService.onModuleInit 连不上库会直接退出，而删
      # namespace 重建时 MySQL 尚未 ready，server 会连续重启（实测 4 次）。
      # 目标地址从 ConfigMap 的 DATABASE_URL 运行时解析，与 server 自身取值同源；
      # 不在此处重复拼装，避免产生第二份可能漂移的真相。复用 server 镜像，不引入新镜像。
      initContainers:
        - name: wait-for-db
          image: {{ printf "%s:%s" .Values.server.image.repository (.Values.server.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy | default .Values.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const net = require('net');
              const target = new URL(process.env.DATABASE_URL);
              const host = target.hostname;
              const port = Number(target.port || 3306);
              const deadline = Date.now() + Number(process.env.DB_WAIT_TIMEOUT_SECONDS) * 1000;
              const pollMs = Number(process.env.DB_WAIT_POLL_SECONDS) * 1000;
              const attempt = () =>
                new Promise((resolve) => {
                  const socket = net.connect({ host, port });
                  const fail = () => { socket.destroy(); resolve(false); };
                  socket.setTimeout(2000);
                  socket.once('connect', () => { socket.destroy(); resolve(true); });
                  socket.once('error', fail);
                  socket.once('timeout', fail);
                });
              (async () => {
                for (;;) {
                  if (await attempt()) {
                    console.log(`db reachable at ${host}:${port}`);
                    process.exit(0);
                  }
                  if (Date.now() > deadline) {
                    console.error(`db not reachable at ${host}:${port} within ${process.env.DB_WAIT_TIMEOUT_SECONDS}s`);
                    process.exit(1);
                  }
                  await new Promise((r) => setTimeout(r, pollMs));
                }
              })();
          envFrom:
            - configMapRef:
                name: {{ include "vteam.config.name" . }}
          env:
            - name: DB_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.server.dbWait.timeoutSeconds | default 180 | quote }}
            - name: DB_WAIT_POLL_SECONDS
              value: {{ .Values.server.dbWait.pollIntervalSeconds | default 2 | quote }}
      containers:
        - name: server
          image: {{ printf "%s:%s" .Values.server.image.repository (.Values.server.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.env.port }}
              protocol: TCP
          # 非敏感 env（DATABASE_URL / NODE_ENV / PORT / JWT 时效 / 首字超时）
          envFrom:
            - configMapRef:
                name: {{ include "vteam.config.name" . }}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vteam.secretName" . }}
                  key: JWT_SECRET
            - name: WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vteam.secretName" . }}
                  key: WORKER_TOKEN
            - name: MODEL_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vteam.secretName" . }}
                  key: MODEL_CREDENTIAL_KEY
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # 产出物落盘持久化（P2）：/app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          # 探针：/api/v1/health（容器 node 内置 fetch，对齐 compose healthcheck）
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.server.env.port }}/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            failureThreshold: {{ .Values.server.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.server.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.startup.timeoutSeconds }}
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.server.env.port }}/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            failureThreshold: {{ .Values.server.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.server.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.readiness.timeoutSeconds }}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.server.env.port }}/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            failureThreshold: {{ .Values.server.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.server.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.liveness.timeoutSeconds }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "vteam.fullname" . }}-uploads
