# vteam 敏感配置
# existingSecret 非空时不渲染本 Secret（各组件从外部 Secret 读同名 key）。
# 未提供 secret.* 值时：首次安装自动生成随机值并写入本 Secret；
# 升级时经 lookup 复用已有值，避免密码轮换导致 DB 失配。
{{- if not .Values.secret.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "vteam.secret.name" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vteam.secret.name" . }}
  labels:
    {{- include "vteam.labels" (dict "context" . "component" "secret") | nindent 4 }}
type: Opaque
data:
  # 登录 JWT 签名密钥
  JWT_SECRET: {{ if $existing }}{{ index $existing.data "JWT_SECRET" }}{{ else }}{{ include "vteam.jwtSecret" . | b64enc }}{{ end }}
  # worker 注册 / 事件上报鉴权 token（worker 端 X_WORKER_TOKEN 同源）
  WORKER_TOKEN: {{ if $existing }}{{ index $existing.data "WORKER_TOKEN" }}{{ else }}{{ include "vteam.workerToken" . | b64enc }}{{ end }}
  # 模型凭据 AES-256-GCM 加密主密钥（32 字节 utf8；生产建议 openssl rand -hex 32）
  MODEL_CREDENTIAL_KEY: {{ if $existing }}{{ index $existing.data "MODEL_CREDENTIAL_KEY" }}{{ else }}{{ include "vteam.modelKey" . | b64enc }}{{ end }}
  # MySQL root 密码（内置 DB 时使用；与 configmap DATABASE_URL 同源）
  DB_PASSWORD: {{ if $existing }}{{ index $existing.data "DB_PASSWORD" }}{{ else }}{{ include "vteam.dbPassword" . | b64enc }}{{ end }}
{{- end }}
