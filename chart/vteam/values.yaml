# vteam Helm chart 默认值
# 对齐 docker-compose.yml（db / init / server / web / worker 五服务）。

## ---------------------------------------------------------------------------
## 全局命名
## ---------------------------------------------------------------------------
nameOverride: ""
## 全量资源名前缀（默认 <release>-vteam）。如 fullnameOverride: vteam → vteam-server 等
fullnameOverride: ""

imagePullSecrets: []
#  - name: registry-secret

## 全局镜像拉取策略（各服务 image.pullPolicy 未设置时生效）
image:
  pullPolicy: IfNotPresent

## ---------------------------------------------------------------------------
## 副本数
## ---------------------------------------------------------------------------
replicaCount:
  server: 1
  web: 1
  ## 常驻 1 副本（与 compose 五服务一致）：/models/integrations 的注册表取自在线
  ## worker 的 GET /integrations，收缩到 0 会让 Provider 下拉直接降级为空
  ## （外部旧版 worker 不支持该端点）。helm upgrade 会按此值收敛 StatefulSet。
  worker: 1

## ---------------------------------------------------------------------------
## 敏感配置
## 默认留空：chart 首次安装时自动生成随机值（helm install 时写入 Secret，
## 升级复用已有值）。生产环境建议显式提供：
##   --set secret.jwtSecret=$(openssl rand -hex 32) 等
## existingSecret：提供外部 Secret 名时，模板不再自建 Secret，各组件从
## 该 Secret 读取同名 key（JWT_SECRET / WORKER_TOKEN / MODEL_CREDENTIAL_KEY /
## DB_PASSWORD / OPENCODE_SERVER_PASSWORD）。若同时启用内置 MySQL（db.enabled=true），
## 需一并提供 secret.dbPassword（configmap 拼装 DATABASE_URL 需要明文密码）。
## OPENCODE_SERVER_PASSWORD：worker 的 opencode serve 密码（**v2 恒开鉴权，worker 必需**：
## 未下发则 serve 启动即 fail-fast，worker 起不来）。**本 chart 不提供明文入口**
## （明文落 values.yaml = 泄露面，且会进 helm 命令行 / values 仓库）——缺省自动生成
## 随机值写入上面的 Secret（升级复用，不轮换）；需自控密码时用 secret.existingSecret
## 指向自己的 Secret（data 须含同名 key OPENCODE_SERVER_PASSWORD）。
## ⚠️ 该密码**只由 worker 容器持有**：控制面自 v2 适配起不再直连 serve（只经 worker 执行
## 端点 + X-Worker-Token 鉴权）⇒ server 容器**不再注入** SERVER_PASSWORD，两侧也**不需要**
## 同值（旧文档里"必须同值否则全线 401"的说法已随 v2 适配失效）。
## ---------------------------------------------------------------------------
secret:
  jwtSecret: ""            # 空 → 自动生成（32 字符随机）
  workerToken: ""          # 空 → 自动生成（32 字符随机）
  modelCredentialKey: ""   # 空 → 自动生成（32 字节 utf8，满足 AES-256-GCM 约束）
  dbPassword: ""           # 空 → 自动生成（16 字符随机）
  existingSecret: ""       # 外部 Secret 名（data 含 JWT_SECRET 等同名 key，含 OPENCODE_SERVER_PASSWORD）

## ---------------------------------------------------------------------------
## 数据库
## db.enabled=true（默认）：内置 MySQL 8 StatefulSet（非 bitnami，自包含简单实现）
## db.enabled=false：必须 external.enabled=true 并提供 url（外部 DATABASE_URL）
## ---------------------------------------------------------------------------
db:
  enabled: true
  external:
    enabled: false
    url: ""                # 例：mysql://user:pass@external-mysql:3306/aiagents
  database: aiagents
  port: 3306
  ## binlog 释放策略（2026-10-15 磁盘写满事故后新增，声明化以便 PVC 重建/换环境后依然生效）。
  ## 事故复盘：binlog 无界累积到 251GB（255 个 × ~1GB），把共享的 983GB NFS 写到 100%，
  ## mysqld 以 ENOSPC（posix_fallocate error 28 + signal 6）崩溃并 CrashLoopBackOff，全站 500。
  ## 本环境无副本、不做 PITR，故保留窗口取 1 小时即可：即便按事故期的 ~20-30GB/小时 写入速率，
  ## 稳态占用也被压在 ~20-30GB；每 delta 写放大修复落地后应进一步降到数 GB 级。
  ## 将来若确需更长的 PITR 窗口再调大，并同步确认共享存储余量。
  binlogExpireLogsSeconds: 3600
  image:
    repository: docker.ketaops.cc/library/mysql
    tag: "8"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi

## ---------------------------------------------------------------------------
## server（NestJS，对齐 compose environment + healthcheck）
## ---------------------------------------------------------------------------
server:
  image:
    ## Dockerfile: ./server
    repository: docker.ketaops.cc/ketaops/vteam-server
    tag: latest
    pullPolicy: IfNotPresent
  env:
    nodeEnv: production
    port: 3000
    jwtAccessExpiresIn: 2h
    jwtRefreshExpiresIn: 7d
    ## server 事件静默自愈窗口 ms（滑动，对齐 compose SILENT_SESSION_WAKE_MS=600000）
    silentSessionWakeMs: "600000"
    agentIdleTimeoutMs: "0"
    ## 记忆定时整理（Todo 9）：间隔 ms，**0 = 禁用**（不排期并取消既有行）。默认 7 天
    memoryMaintenanceIntervalMs: "604800000"
    ## 期望 worker 代码版本（worker-self-update Todo 2）：deploy-k8s.sh 以
    ## `--set server.env.codeVersion=$TAG` 注入（TAG = git 短 SHA，与 pack-worker 发布的
    ## tarball 同源）。**空串 = 不下发期望版本**（心跳响应省略 expectedVersion，UI 不做
    ## 「版本不一致」判定）——手写 helm install / 本地栈即此缺省语义。
    codeVersion: ""
  ## initContainer 等待数据库「schema 就绪」的最长秒数。判据是 prisma migrate status
  ## 报 up to date——只探 TCP 不够：MySQL 端口可连时迁移可能尚未跑完，server 会以
  ## P2021（表不存在）退出并反复重启。
  schemaWait:
    timeoutSeconds: 300
    pollIntervalSeconds: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      ## 2026-10-15 OOM 事故实录（本行是「过渡余量」，不是修复）：
      ##   1Gi → 启动约 30s 即 OOMKilled（exitCode 137 → CrashLoopBackOff，探针同时超时）；
      ##   2Gi → 仍累计 14 次 OOMKilled；
      ##   4Gi（直接 patch deployment，未走 helm）→ 仍持续 OOMKilled：17 分钟内重启 6 次，
      ##         BackOff x27/14m，VmHWM 已达 ~2.0GB 且单调爬升，约每 3 分钟被顶穿一次。
      ## 结论：**这是「加内存赢不了的竞赛」**——增长来自「每个 delta 的驻留」而非峰值抖动，
      ## 任何内存上限都只是把时间往后推。真正的修复是代码侧（见 .omo/plans/team-worker-node.md
      ## 「部署后登记的后续加固项」）：
      ##   · 回放封顶 1000 + 24h 保留任务 + createdAt 索引（commit ee27da3）；
      ##   · 内存事件日志 8MiB 字节封顶 + message.part.delta 零落库（同上）；
      ##   · delta 组装态缓存（含错误终局与看门狗终局的失效）。
      ## 8Gi 仅为切换期余量。修复上线后实测（30 分钟、20 秒粒度采样）：RSS 在 300–680MB 之间
      ## 锯齿震荡、GC 逐次回收、峰值 676MB 保持 25 分钟未再抬升、restartCount 0，不再单调爬升。
      ## 故按「不占用过多资源」原则下调回 2Gi（约 3× 余量），让 OOM 重新成为可见信号。
      memory: 2Gi
  ## 探针：/api/v1/health，容器 node 内置 fetch（对齐 compose healthcheck）
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5

## ---------------------------------------------------------------------------
## web（Next.js standalone，对齐 compose healthcheck $HOSTNAME 语义）
## ---------------------------------------------------------------------------
web:
  image:
    ## Dockerfile: ./web（Next.js standalone）
    repository: docker.ketaops.cc/ketaops/vteam-web
    tag: latest
    pullPolicy: IfNotPresent
    ## 运行时代理目标（middleware.ts 同源代理读取）：部署时注入 web 容器 env
    ## API_PROXY_TARGET（见 deployment-web.yaml）。缺省对齐本 release 的
    ## server Service（http://<release>-server:3000），无需按环境重建镜像。
    proxyTarget: http://vteam-server:3000
  env:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5
    liveness:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5

## ---------------------------------------------------------------------------
## worker（opencode 执行节点，对齐 compose environment）
## ---------------------------------------------------------------------------
worker:
  image:
    ## Dockerfile: ./worker（opencode 执行节点）
    repository: docker.ketaops.cc/ketaops/vteam-worker
    tag: latest
    pullPolicy: IfNotPresent
  env:
    serveHostname: 0.0.0.0
    servePort: "4000"
    ## 默认模型兜底（Agent 未配模型时用）；空 = 不指定（serve 默认）
    defaultModel: ""
    ## worker 首字超时 ms（对齐 compose WORKER_FIRST_TOKEN_TIMEOUT_MS=300000；首字探测唯一归
    ## worker，server 侧为 SILENT_SESSION_WAKE_MS 事件静默自愈）
    firstTokenTimeoutMs: "300000"
    workDir: /data/vteam-worker
    ## worker 唯一 id；空 = 自动按 pod 名生成（w_<pod 名>，downward API 注入，
    ## 多副本天然唯一）；显式设置时用该值（注意多副本下须自行保证唯一）
    workerId: ""
    ## worker 代码版本（WORKER_CODE_VERSION，configmap worker 段下发）：
    ## 决定 worker 向 server 上报的 codeVersion（版本徽章 / 自更新比对）。
    ## 缺省空 = 不注入该 env（worker 侧回落 dist/version.js 文件戳，再回落 'dev'；
    ## chart 部署的镜像内无版本戳文件，故实际表现为 'dev'）。
    ## 部署时用 --set worker.env.codeVersion=<git short sha> 注入，与发布 tarball
    ## （web/public/worker-src.version.json 的 version 同源）对齐。
    codeVersion: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 8Gi
  ## 不设 HTTP 探针（对齐 compose：worker 无 healthcheck）；
  ## readiness 探活由 server 心跳判 offline（server 30s = 3 周期）
  ## ---------------------------------------------------------------------------
  ## 持久化（StatefulSet volumeClaimTemplates，默认启用：每副本独立 PVC）
  ## 独立 home 卷隔离 opencode.db（SQLite 会话库）——多副本不再共享同一 PVC，
  ## 避免并发写损坏；replicaCount 扩容 → StatefulSet 自动为新增 ordinal
  ## 创建独立 PVC（<template 名>-<sts 名>-<ordinal>，如 worker-home-vteam-worker-1）。
  ## enabled=false 时该卷回退 emptyDir（临时，重启即失，生产不建议关闭）。
  ## ---------------------------------------------------------------------------
  persistence:
    workerHome:              # worker 用户目录（opencode.db 会话库、auth.json 凭据、log、repos）
      enabled: true
      size: 5Gi
      storageClass: ""       # 空 → 集群默认 StorageClass
    workerWork:              # worker 工作目录（serve cwd、.opencode 注入、git clone 仓库、任务文件）
      enabled: true
      size: 10Gi
      storageClass: ""
  ## StatefulSet 滚动更新（RollingUpdate）。partition 空 = 全量滚动（默认）；
  ## 设置数字时仅更新 ordinal >= partition 的副本（如升级场景先升 worker-1 保留 worker-0）。
  updateStrategy:
    partition: ""            # 空 → 不渲染 rollingUpdate（默认全量）

## ---------------------------------------------------------------------------
## init Job（一次性：prisma migrate deploy && node dist/prisma/seed.js）
## ---------------------------------------------------------------------------
initJob:
  ## 对齐 compose depends_on: db(healthy)+init(completed) 门控：
  ## init 以 initContainer 等待 DB 就绪后再跑迁移/种子，失败自动重试
  ## platformMcpUrl：内置 vteam MCP 的 URL（seed 写入 mcp_servers 表）。
  ## 空 = 模板按 release 拼 http://<fullname>-server:3000/api/v1/platform-mcp
  ##     （K8s 下 server 服务名，seed 默认 compose 的 server:3000 不可用）；
  ## 显式设置时用该值（如外部自定义服务名/路径）。
  platformMcpUrl: ""
  backoffLimit: 6
  ## Job 完成后自动清理（默认 300s）
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi

## ---------------------------------------------------------------------------
## 持久化（PVC 名带 release 前缀：<fullname>-uploads）
## worker 数据卷已迁至 worker.persistence（StatefulSet volumeClaimTemplates，
## 每副本独立 PVC，见 worker 段）；不再定义共享的 worker-home / worker-work PVC。
## mysql 用 StatefulSet volumeClaimTemplates（<fullname>-mysql-data-<fullname>-mysql-0）
## ---------------------------------------------------------------------------
persistence:
  uploads:                 # server 静态上传目录（产出物落盘，P2）
    enabled: true
    size: 10Gi
    storageClass: ""       # 空 → 集群默认 StorageClass
  mysql:                   # MySQL 数据（db.enabled 时经 volumeClaimTemplates 生效）
    enabled: true
    size: 20Gi
    storageClass: ""

## ---------------------------------------------------------------------------
## Service（ClusterIP）
## worker 无共享 ClusterIP Service：serve 仅经 headless DNS/pod 名访问
## （service.worker 段仅被 service-worker-headless.yaml 引用，用于 StatefulSet
## serviceName 的端口定义）；调试 opencode serve 用
## kubectl port-forward sts/<release>-worker 14000:4000（转发到 ordinal 0）
## ---------------------------------------------------------------------------
service:
  server:
    port: 3000
    targetPort: 3000
  web:
    port: 3000
    targetPort: 3000
  worker:
    ## 仅供 worker Headless Service（service-worker-headless.yaml）引用：
    ## serve 端口（:4000），无共享 ClusterIP 入口
    port: 4000
    targetPort: 4000
  mysql:
    port: 3306
    targetPort: 3306

## ---------------------------------------------------------------------------
## Ingress（默认关闭）
## ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: vteam.example.com
  ## 路径路由：/api/v1 → server:3000，/ → web:3000
  ## SSE 兼容（realtime SSE 长连接 /api/v1/events）：关闭响应缓冲（事件实时推送）
  ## + 调大读超时（默认 60s 会断流；server 侧 10s 心跳保活兜底，此处放宽到 1h）。
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    ## SSE 必需：nginx→upstream 默认 HTTP/1.0，不支持 chunked 传输，
    ## text/event-stream 会表现为「连响应头都收不到、字节数为 0」（实测直连 200+3754 字节、
    ## 经 ingress 0 字节）。升到 1.1 后按分块透传，事件实时推送。
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  tls:
    enabled: false
    secretName: ""         # 空 → 用 <fullname>-tls（需 cert-manager 签发注解）

## ---------------------------------------------------------------------------
## worker 内部 opencode serve 的独立 Ingress（web 终端调试入口）
## ---------------------------------------------------------------------------
## ⚠️ 安全：OpenCode v2 的 serve **恒开鉴权** —— 密码由 worker 侧显式下发
##    （OPENCODE_SERVER_PASSWORD）。本 chart 已把该密码纳入 Secret 管理：缺省自动
##    生成随机值写入 Secret 的 OPENCODE_SERVER_PASSWORD key，worker 容器经
##    secretKeyRef 注入（**明文不进 values.yaml / extraEnv**）；需自控密码时走
##    secret.existingSecret（该 Secret 须含同名 key，值与 worker 侧一致）。
##    紧急/调试可用 extraEnv 下发 OPENCODE_ALLOW_GENERATED_PASSWORD=1——未设密码时
##    改为让 worker 捕获 opencode 自动生成的密码（明文不落日志）。
##    该入口仍等同于「可执行任意命令、读写任意文件的 Web 终端」。默认关闭；仅在受控
##    环境开启，并强烈建议同时设置 whitelistSourceRange（如 "10.0.0.0/8,203.0.113.7/32"）限源。
##
## host 默认 opencode.<ingress.host>（独立 host：nginx-ingress 的注解按 host 生效，
## 与主 ingress 混用同 host 会互相污染；opencode web 是 SPA，独立 host 也无需 rewrite）。
opencodeIngress:
  enabled: false
  host: ""                 # 空 → opencode.<ingress.host>（需 DNS/hosts 指向该集群）
  whitelistSourceRange: "" # 空 = 不限源（公网暴露前务必设置）
  ## SSE/流式（opencode web 的事件流、工具输出流）：与主 ingress 同口径 + HTTP/1.1
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  tls:
    enabled: false
    secretName: ""         # 空 → 用 <fullname>-opencode-tls

## ---------------------------------------------------------------------------
## serviceAccount（init Job 等可选）
## ---------------------------------------------------------------------------
serviceAccount:
  create: false
  name: ""

## 调度约束
nodeSelector: {}
tolerations: []
affinity: {}

## 额外 env（透传给 server / web / worker 全部容器，可用于覆盖 NODE_ENV 等）
extraEnv: []
#  - name: LOG_LEVEL
#    value: debug
