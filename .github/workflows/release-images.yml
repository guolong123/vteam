# 发布 vteam 三个镜像到 Docker Hub，linux/amd64 + linux/arm64 双架构。
#
# 设计要点：
# - 触发：push tag v*（正式发布）或手动 workflow_dispatch（试跑/补发）。
# - 双架构**不用 QEMU**：amd64 跑 ubuntu-latest，arm64 跑 ubuntu-24.04-arm（public 仓库免费）。
#   worker/Dockerfile 里 bun / Chrome 在 QEMU 模拟下已知会失败，原生 runner 可绕开。
# - 每个 (镜像 × 架构) 是独立 job，并行构建；**单架构只推 blob 不带 tag**
#   （push-by-digest），digest 经 artifact 传给收尾 job，
#   由 `docker buildx imagetools create` 合成唯一的多架构 <image>:<version>；
#   正式 tag 时额外更新 :latest。仓库里不会出现 -amd64 / -arm64 之类中间 tag。
# - 基础镜像在 CI 固定用 docker.io（runner 在海外直连最快）；本地构建仍用 Dockerfile 里
#   ARG NODE_IMAGE 的默认值 docker.ketaops.cc。
# - 层缓存按 镜像-架构 分 scope（type=gha），避免不同镜像互相污染。
name: Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本 tag（如 v1.2.3）'
        required: true
        default: 'v0.0.0-manual'
      update_latest:
        description: '同时更新 :latest'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAMESPACE: guojongg
# 基础镜像**按具体版本钉住**（不是 22-alpine / 22-bookworm-slim 这类浮动 tag）：
# 浮动 tag 会在上游 rebuild 时换 digest（v1.1.1→v1.2.0 实测换了：
#   3ed9844… → de170b3…），基础层一变，**下面所有层全部失效** ⇒ 6 个构建 job 缓存命中
# 数为 0、镜像层全变 ⇒ 集群每次发布都要整包重拉（worker 镜像 GB 级）。
# 升级 node 时改这里的两个版本号即可（同时改 worker/Dockerfile 的 ARG 默认值）。

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      update_latest: ${{ steps.resolve.outputs.update_latest }}
    steps:
      - id: resolve
        name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            LATEST="${{ inputs.update_latest }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            # 仅严格 semver 的正式 tag（v1.2.3）更新 latest；v1.2.3-rc1 / v0.1.0-test1 等预发布不更新
            if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              LATEST=true
            else
              LATEST=false
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} update_latest=${LATEST}"

  build:
    name: ${{ matrix.image }} · ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: server/Dockerfile
            context: server
            node_tag: 22.23.4-alpine
            free_disk: false
          - image: server
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: server/Dockerfile
            context: server
            node_tag: 22.23.4-alpine
            free_disk: false
          - image: web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: web/Dockerfile
            context: .
            node_tag: 22.23.4-alpine
            free_disk: false
          - image: web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: web/Dockerfile
            context: .
            node_tag: 22.23.4-alpine
            free_disk: false
          - image: worker
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            dockerfile: worker/Dockerfile
            context: worker
            node_tag: 22.23.4-bookworm-slim
            free_disk: true
          - image: worker
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: worker/Dockerfile
            context: worker
            node_tag: 22.23.4-bookworm-slim
            free_disk: true
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (worker 镜像较大)
        if: matrix.free_disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.image }} (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # 只推 blob、不打 tag：单架构镜像不进 tag 列表，最终只留多架构 <version>
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/vteam-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            NODE_IMAGE=docker.io/library/node:${{ matrix.node_tag }}
            CODE_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: merge multi-arch manifests
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Create multi-arch manifests
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          UPDATE_LATEST: ${{ needs.meta.outputs.update_latest }}
        run: |
          set -euo pipefail
          for img in server web worker; do
            ref="${IMAGE_NAMESPACE}/vteam-${img}"
            srcs=()
            for arch in amd64 arm64; do
              dir="/tmp/digests/digest-${img}-${arch}"
              f="$(find "$dir" -maxdepth 1 -type f | head -1)"
              if [ -z "$f" ]; then
                echo "::error::missing digest for ${img}/${arch} (looked in ${dir})"
                exit 1
              fi
              srcs+=("${ref}@sha256:$(basename "$f")")
            done
            echo "creating ${ref}:${VERSION} <- ${srcs[*]}"
            docker buildx imagetools create -t "${ref}:${VERSION}" "${srcs[@]}"
            if [ "${UPDATE_LATEST}" = "true" ]; then
              docker buildx imagetools create -t "${ref}:latest" "${srcs[@]}"
            fi
          done

      - name: Verify manifests
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          for img in server web worker; do
            echo "--- ${IMAGE_NAMESPACE}/vteam-${img}:${VERSION}"
            docker buildx imagetools inspect "${IMAGE_NAMESPACE}/vteam-${img}:${VERSION}"
          done

      - name: Verify tag list (no intermediate arch tags)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 用 registry API 列出真实 tag：证明仓库里只有多架构 tag，没有 -amd64/-arm64 中间产物。
          for img in server web worker; do
            repo="${IMAGE_NAMESPACE}/vteam-${img}"
            token="$(curl -fsSL -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" \
              | jq -r .token)"
            tags="$(curl -fsSL -H "Authorization: Bearer ${token}" \
              "https://registry-1.docker.io/v2/${repo}/tags/list?n=100" | jq -r '.tags[]' | sort)"
            echo "--- ${repo} tags:"
            echo "${tags}"
            # 只断言本次 version 无中间 tag：更早的历史遗留 tag 不阻断发布
            if echo "${tags}" | grep -qE -- "^${VERSION}-(amd64|arm64)$"; then
              echo "::error::found intermediate arch tag for ${VERSION} in ${repo}"
              exit 1
            fi
            echo "${tags}" | grep -qx "${VERSION}" || { echo "::error::${repo} missing tag ${VERSION}"; exit 1; }
          done
