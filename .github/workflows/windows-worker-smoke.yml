# Windows worker M0 验收 smoke（手动触发；不随 push 自动跑）
#
# 目的：在真实 Windows（windows-latest = Windows Server 2022）上验收本仓库的 Windows 原生
# 支持改动，而不是只验上游 opencode。跑完会输出全部日志；失败点即真机待修项。
#
# 覆盖：
#   1) 平台无关单测（cli-command / process-tree / config / git-tools / sensitive-command /
#      ensure-work-dir / dsh spawn-error —— 其中的 POSIX 专有用例已按 platform skip）
#   2) 解析 OPENCODE_BIN：npm 全局 opencode.cmd（win32 的 .cmd shim 形态）
#   3) worker 独立模式真实启动：spawn opencode serve → Basic Auth /api/info 200 → 进程存活
#      （这是旧 worker 在 Windows 上的**首要失败点**：spawn opencode ENOENT）
#   4) 平台断言：WORK_DIR 缺省落在 %LOCALAPPDATA%、WORKER_ENGINE=dsh 启动即拒绝、
#      cli-command 在 win32 上走 cmd 包装
#   5) 退出后 taskkill /T 无残留（由启动步骤的清理路径覆盖）
#
# 用法：仓库 Actions 页 → windows-worker-smoke → Run workflow（可改 opencode_spec）。
name: windows-worker-smoke

on:
  workflow_dispatch:
    inputs:
      opencode_spec:
        description: 'opencode CLI 的 npm spec（缺省钉 2.0.32）'
        required: false
        default: '@opencode/cli@2.0.32'

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: runner info
        shell: pwsh
        run: |
          node --version
          npm --version
          $PSVersionTable.PSVersion.ToString()
          [System.Environment]::OSVersion.VersionString
          Test-Path "$env:SystemRoot\System32\tar.exe"

      - name: npm ci
        run: npm ci

      - name: build (tsc)
        run: npm run build

      - name: install opencode CLI (Windows)
        shell: pwsh
        run: |
          npm install -g '${{ inputs.opencode_spec }}'
          $prefix = (npm prefix -g).Trim()
          $cmd = Join-Path $prefix 'opencode.cmd'
          if (-not (Test-Path $cmd)) { throw "opencode.cmd not found under $prefix" }
          "OPENCODE_CMD=$cmd" | Out-File -FilePath "$env:GITHUB_ENV" -Encoding utf8 -Append
          & $cmd --version

      - name: platform-agnostic unit tests (win32 branches)
        run: |
          npx jest --runInBand src/runtime/cli-command.spec.ts src/runtime/process-tree.spec.ts src/config.spec.ts src/git/git-tools.spec.ts src/exec/sensitive-command.platform.spec.ts src/ensure-work-dir.spec.ts src/driver/dsh-rpc-client.spawn-error.spec.ts 2>&1 | Tee-Object -FilePath windows-unit.log

      - name: platform assertions (WORK_DIR default / dsh reject / cmd wrapping)
        shell: pwsh
        run: |
          # 1) WORK_DIR 缺省：Windows 必须落在 %LOCALAPPDATA%\vteam-worker（不能是 C:\data）
          node -e "const c=require('./dist/config').loadConfig({X_WORKER_TOKEN:'t',OPENCODE_SERVER_PASSWORD:'p'}); console.log('workDir='+c.workDir); if(!c.workDir.toLowerCase().startsWith(process.env.LOCALAPPDATA.toLowerCase())) { console.error('FAIL: workDir 未落在 LOCALAPPDATA'); process.exit(1); }"
          # 2) dsh 在 Windows 必须启动即拒绝（不静默回落 opencode）
          node -e "try { require('./dist/config').loadConfig({X_WORKER_TOKEN:'t',OPENCODE_SERVER_PASSWORD:'p',WORKER_ENGINE:'dsh'}); console.error('FAIL: dsh 未被拒绝'); process.exit(1); } catch (e) { if (!/只支持 opencode/.test(e.message)) { console.error('FAIL: 错误文案不含指引: '+e.message); process.exit(1); } console.log('dsh rejected: '+e.message.slice(0,80)+'...'); }"
          # 3) win32 上裸名 opencode 必须解析成 cmd 包装（而不是直接 spawn 导致 ENOENT）
          node -e "const {resolveCliCommand}=require('./dist/runtime/cli-command'); const r=resolveCliCommand({command:'opencode',args:['--version']}); console.log(JSON.stringify(r)); if(!r.viaShell) { console.error('FAIL: 未走 cmd 包装'); process.exit(1); } if(!/opencode\.(cmd|exe)$/i.test(r.resolvedPath)) { console.error('FAIL: resolvedPath 不是 .cmd/.exe: '+r.resolvedPath); process.exit(1); }"

      - name: standalone worker startup (serve + Basic Auth + no spawn failure)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:WORKER_STANDALONE = 'true'
          $env:X_WORKER_TOKEN = 'smoke-worker-token'
          $env:OPENCODE_SERVER_PASSWORD = 'smoke-pass-123'
          $env:OPENCODE_BIN = $env:OPENCODE_CMD
          $env:OPENCODE_SERVE_PORT = '4199'
          $env:WORKER_EXEC_PORT = '4198'
          $env:WORK_DIR = Join-Path $env:RUNNER_TEMP 'vteam-worker'
          $env:LOG_LEVEL = 'debug'
          $p = Start-Process node -ArgumentList 'dist/index.js' `
            -RedirectStandardOutput "$PWD\worker-standalone.log" `
            -RedirectStandardError "$PWD\worker-standalone.err.log" `
            -PassThru -NoNewWindow
          $ok = $false
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            try {
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('opencode:smoke-pass-123'))
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4199/api/info' -Headers @{ Authorization = "Basic $auth" } -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          $earlyExit = $p.HasExited
          if (-not $p.HasExited) { taskkill /PID $p.Id /T /F 2>&1 | Out-Null }
          echo '--- worker stdout ---'
          Get-Content "$PWD\worker-standalone.log" -ErrorAction SilentlyContinue
          echo '--- worker stderr ---'
          Get-Content "$PWD\worker-standalone.err.log" -ErrorAction SilentlyContinue
          if ($earlyExit) { throw 'worker 进程提前退出（见上方日志）' }
          if (-not $ok) { throw 'opencode serve 未在 120s 内就绪（/api/info 未返回 200）' }
          if (Select-String -Path "$PWD\worker-standalone.err.log" -Pattern 'spawn 失败|spawn opencode ENOENT' -Quiet) { throw '日志出现 spawn 失败' }
          echo 'WINDOWS WORKER M0 SMOKE OK'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-worker-m0-logs
          path: worker/*.log
          if-no-files-found: ignore
