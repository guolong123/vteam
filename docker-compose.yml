# ============================================================
# Phase 5 T11：docker compose 一键部署（D5 编排方案，Oracle 实测）
#
# 四服务 + 一个一次性 init 服务：
#   db      mysql:8（volume + healthcheck，compose 网络内互通，不映射宿主端口）
#   init    一次性：prisma migrate deploy + seed（service_completed_successfully 门控 server）
#   server  NestJS（healthcheck /api/v1/health；宿主 13000 避开本地 dev 3000）
#   web     Next.js standalone（build ARG 注入 API_PROXY_TARGET=http://server:3000；
#           宿主 13001 避开本地 dev 3001）
#   worker  opencode worker（X-Worker-Token 注册 + serve 0.0.0.0 + 上报 http://worker；
#           模型管理：WORKER_DEFAULT_MODEL 默认模型兜底 + 凭据下发注入 auth.json）
#
# 端口避开原则：本机本地 dev server 占 3000 / web dev 占 3001，relay-mysql 占 3306，
# aiagents-mysql 占 3307，故 db 不映射、server→13000、web→13001。
# 运行：docker compose up -d --build
# 清理：docker compose down（保留 volume） / docker compose down -v（连数据一起删）
# ============================================================

name: aiagents

services:
  db:
    image: mysql:8
    container_name: aiagents-compose-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aiagents-root}
      MYSQL_DATABASE: aiagents
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 不校验凭据，仅探测 mysqld 存活（认证失败仍返回 alive）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - aiagents-net

  # 一次性初始化：迁移基线 + 种子数据（server 依赖其成功完成）
  # seed 用编译产物 node dist/prisma/seed.js（npm run build 产出；runner 镜像无源码不能 ts-node）
  init:
    build: ./server
    container_name: aiagents-compose-init
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js"
    environment: &server-env
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-aiagents-root}@db:3306/aiagents
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aiagents-net

  server:
    build: ./server
    container_name: aiagents-compose-server
    restart: unless-stopped
    environment:
      <<: *server-env
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-compose-dev-jwt-secret}
      JWT_ACCESS_EXPIRES_IN: "2h"
      JWT_REFRESH_EXPIRES_IN: "7d"
      WORKER_TOKEN: ${WORKER_TOKEN:-compose-worker-token}
      # 模型 provider token 加密密钥（C4 AES-256-GCM，32 字节/64 hex）。
      # 必填校验：未设置即启动报错（拒绝公开默认值导致密钥泄露）。生成方式：openssl rand -hex 32
      MODEL_CREDENTIAL_KEY: ${MODEL_CREDENTIAL_KEY:?MODEL_CREDENTIAL_KEY 未设置，请生成 32 字节随机密钥（openssl rand -hex 32）}
      # 首字超时（server dispatcher watchdog）：dispatch 后 FIRST_TOKEN_TIMEOUT_MS 内无任何
      # 事件回流 → 判「agent 无响应」。180s ≥ worker 首字超时 120s + 余量——复杂任务长思考
      # 不因 60s 默认值被误报；env 可配。worker 成功路径已主动上报 agent.status(loading)
      # 清除本 watchdog（B 方案），此值作为兜底防线。
      FIRST_TOKEN_TIMEOUT_MS: "180000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      # node:22-alpine 无 curl/wget，用内置 fetch（node 18+ 全局可用）
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "13000:3000"
    volumes:
      # P2 产出物落盘持久化：Agent 文档/文件产出物存 /app/uploads（server 静态服务挂载点），
      # 容器重建不丢文件（DB 元数据与磁盘文件一致；未挂载时 down 后文件丢失、前端降级纯文本）
      - uploads_data:/app/uploads
    networks:
      - aiagents-net

  web:
    build:
      context: ./web
      args:
        # T1 铁律：rewrites 编译进 routes-manifest.json，运行时 env 无效，必须 build ARG 注入
        API_PROXY_TARGET: http://server:3000
    container_name: aiagents-compose-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # standalone server.js 以 HOSTNAME env（容器自动=容器 ID）为监听地址，非 127.0.0.1；
      # healthcheck 必须访问 $HOSTNAME 而非 loopback（node:22-alpine 无 curl，用内置 fetch）
      test: ["CMD", "node", "-e", "fetch('http://'+process.env.HOSTNAME+':3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "13001:3000"
    networks:
      - aiagents-net

  worker:
    build: ./worker
    container_name: aiagents-compose-worker
    restart: unless-stopped
    environment:
      X_WORKER_TOKEN: ${WORKER_TOKEN:-compose-worker-token}
      SERVER_URL: http://server:3000
      WORKER_ID: w_compose_worker
      OPENCODE_SERVE_HOSTNAME: 0.0.0.0
      # 固定 opencode serve 端口（不再随机；容器内 4000）
      OPENCODE_SERVE_PORT: "4000"
      WORKER_ADVERTISE_HOST: http://worker
      # worker 默认模型兜底（C2 新增，Agent 未配模型时用，C7 模型解析优先级第 3 级）；空 = 不指定（serve 默认）
      WORKER_DEFAULT_MODEL: ${WORKER_DEFAULT_MODEL:-}
      # 首字超时（worker awaitCompletion）：模型时限内无 text/reasoning 输出即 abort。
      # 对齐 server FIRST_TOKEN_TIMEOUT_MS=180s（compose 同步放宽），防长思考任务被 worker
      # 侧提前 abort（server 侧先误报、worker 侧再误杀的竞态）。
      WORKER_FIRST_TOKEN_TIMEOUT_MS: "180000"
      # 持久化工作目录：serve cwd + .opencode/tools|skills 注入落点 + agent 工作区
      #（git clone 的仓库、任务文件）。改挂载卷路径，容器重建不丢（worker 启动时
      # installGitTools/injector 会在空卷上自动重建 .opencode；镜像内 /tmp/keta-worker
      # 的 dist/node_modules 不受影响，WORKDIR 未变）。
      WORK_DIR: /data/keta-worker
    depends_on:
      server:
        condition: service_healthy
    ports:
      # serve 容器内 4000 → 宿主机 14000，浏览器访问 http://localhost:14000
      - "14000:4000"
    volumes:
      # 工作目录持久化：serve cwd、.opencode 注入、git clone 的仓库与任务文件
      - worker_work:/data/keta-worker
      # 用户目录（HOME=/root）持久化：opencode.db 会话库（session.instanceRef 指向的
      # opencode 会话重建后不 404）、auth.json 模型凭据、.keta-git-creds.json、log、repos
      - worker_home:/root
    networks:
      - aiagents-net

volumes:
  mysql_data:
  # P2：server 产出物落盘持久化（Agent 文档/文件，见 server 服务 volumes 挂载）
  uploads_data:
  # worker 工作目录持久化（serve cwd、.opencode 注入、git clone 的仓库、任务文件）
  worker_work:
  # worker 用户目录（HOME）持久化（opencode.db 会话库、auth.json 模型凭据、.keta-git-creds.json）
  worker_home:

networks:
  aiagents-net:
    driver: bridge
